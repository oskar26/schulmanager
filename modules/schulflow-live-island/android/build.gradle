// Expo SDK 54 module convention. The Expo Gradle plugin owns the compatible
// Android/Kotlin versions and wires expo-modules-core for local modules.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.schulflow.liveisland'
version = '0.1.0'

expoModule {
  canBePublished false
}

android {
  namespace "app.schulflow.liveisland"

  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}
