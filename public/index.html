<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />

    <!--
      viewport-fit=cover: Inhalte dürfen unter der Dynamic Island / Punch-Hole
      durchlaufen — Safe-Areas zieht die App selbst über react-native-safe-area-context.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>%WEB_TITLE%</title>

    <!-- PWA / installierbare Web-App -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="description" content="Schulflow — inoffizieller, schneller Schulmanager-Online-Client. Stundenplan, Hausaufgaben, Noten und Briefe auf einen Blick." />

    <!-- iOS: als Web-App auf dem Homescreen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Schulflow" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- Statusleisten-Farbe (Android Chrome, iOS Safari) -->
    <meta name="theme-color" content="#6C5CE7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0E1A" media="(prefers-color-scheme: dark)" />

    <link rel="icon" type="image/png" href="favicon.png" />

    <style id="expo-reset">
      /* Grund-Reset wie im Expo-Standard-Template */
      #root,
      body,
      html {
        width: 100%;
        -webkit-overflow-scrolling: touch;
        margin: 0;
        padding: 0;
        height: 100%;
      }
      #root {
        flex-shrink: 0;
        flex-basis: auto;
        flex-grow: 1;
        display: flex;
        flex: 1;
      }
      html {
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        height: 100%;
        overscroll-behavior: none;
        background-color: #F8F9FD;
        color: #121422;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
          'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji';
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      /* Splash-Hintergrund vor dem Bundle-Start (Dark) */
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0B0E1A;
          color: #F0F2FA;
        }
      }

      /* Ladeindikator vor dem React-Start */
      #root:empty::before {
        content: '';
        position: absolute;
        inset: 0;
        margin: auto;
        width: 46px;
        height: 46px;
        border-radius: 15px;
        background: #6C5CE7;
        animation: sf-boot 1.1s ease-in-out infinite alternate;
      }
      @keyframes sf-boot {
        from {
          transform: scale(0.86) rotate(-6deg);
          opacity: 0.55;
          border-radius: 15px;
        }
        to {
          transform: scale(1) rotate(4deg);
          opacity: 1;
          border-radius: 23px;
        }
      }

      /* Sichtbarer Fokus fürs Keyboard-/A11y-Bedienen im Web */
      :focus-visible {
        outline: 2px solid #6C5CE7;
        outline-offset: 2px;
        border-radius: 6px;
      }

      /* Scrollbars nicht blocknadel-dick */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(108, 92, 231, 0.35) transparent;
      }
      *::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      *::-webkit-scrollbar-thumb {
        background: rgba(108, 92, 231, 0.35);
        border-radius: 8px;
      }
      *::-webkit-scrollbar-track {
        background: transparent;
      }
    </style>
  </head>

  <body>
    <!-- Statisches Rendering mit Expo Router: funktioniert auch ohne JS bis zur Hydration. -->
    <noscript>Du musst JavaScript aktivieren, um Schulflow zu nutzen.</noscript>
    <div id="root"></div>
  </body>
</html>
