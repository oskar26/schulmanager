<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">Schulflow – Konzept 4 „Pencil Clock“</title>
  <desc id="d">Eine Uhr, deren Minutenzeiger ein Bleistift ist – die Schulstunde.</desc>
  <defs>
    <linearGradient id="p-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFF1FB"/>
    </linearGradient>
    <linearGradient id="p-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B6BFF"/>
      <stop offset="0.6" stop-color="#5A46D6"/>
      <stop offset="1" stop-color="#BD7AF6"/>
    </linearGradient>
  </defs>

  <path fill="url(#p-bg)" d="M256 24c105 0 143 5 179 41s41 74 41 191-5 143-41 179-74 41-179 41-143-5-179-41-41-74-41-179 5-155 41-191S151 24 256 24Z"/>

  <!-- Zifferblatt-Ring, oben offen (Pausen-Lücke) -->
  <path fill="none" stroke="url(#p-ring)" stroke-width="34" stroke-linecap="round"
        d="M256 96a160 160 0 1 1-72 17"/>

  <!-- Stundenmarken -->
  <g fill="#5A46D6" opacity=".28">
    <circle cx="256" cy="146" r="9"/>
    <circle cx="366" cy="256" r="9"/>
    <circle cx="256" cy="366" r="9"/>
    <circle cx="146" cy="256" r="9"/>
  </g>

  <!-- kurzer Zeiger -->
  <path fill="none" stroke="#121422" stroke-width="24" stroke-linecap="round" d="M256 256h-62"/>

  <!-- Bleistift als langer Zeiger -->
  <g transform="rotate(-38 256 256)">
    <rect x="248" y="112" width="46" height="148" rx="14" fill="#FAC748"/>
    <rect x="248" y="112" width="18" height="148" fill="#E8A82F" opacity=".55"/>
    <path fill="#FF7677" d="M248 112h46a0 0 0 0 1 0 0v-8c0-13-10-23-23-23s-23 10-23 23v8Z"/>
    <path fill="#F3DFC3" d="M248 260h46l-15 34a8 8 0 0 1-16 0Z"/>
    <path fill="#121422" d="M264 288h14l-4 8a3 3 0 0 1-6 0Z"/>
  </g>

  <circle cx="256" cy="256" r="20" fill="#121422"/>
  <circle cx="256" cy="256" r="8" fill="#FFFFFF"/>
</svg>
